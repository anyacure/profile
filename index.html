<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title></title>
  <link rel="stylesheet" type="text/css" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="./assets/favico/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.7.2/dist/vanilla-tilt.min.js"></script>
  <link rel="stylesheet" href="./assets/css/tilt-effect.css">
</head>

<body>
  <!-- Loading Screen (Busting Cache with Inline Styles) -->
  <style>
    .pre-loader-overlay {
        background-color: transparent !important;
        backdrop-filter: blur(10px);
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2147483647; /* Absolute maximum z-index */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease;
    }
    .pre-loader-overlay .loader-logo img {
        width: 250px;
        height: auto;
        margin-bottom: 25px;
    }
    .pre-loader-overlay .loader-progress-bg {
        height: 6px;
        border-radius: 10px;
        width: 220px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        position: relative;
    }
    .pre-loader-overlay .loader-progress-bar {
        width: 0%;
        height: 100%;
        background: #00ff88;
        border-radius: 10px;
        box-shadow: 0 0 10px #00ff88;
    }
    .pre-loader-overlay .loading-text {
        color: rgba(255,255,255,0.6);
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        margin-top: 15px;
        letter-spacing: 2px;
    }
  </style>

  <div class="pre-loader-overlay" id="global-preloader">
      <div class="loader-logo">
          <img src="https://khuyen.dvfb.us/assets/images/loader.gif" alt="Initializing...">
      </div>
      <div class="loader-progress-bg">
          <div class="loader-progress-bar" id="loader-bar-fill"></div>
      </div>
      <div class="loading-text" id="loader-text-status">Establishing Connection...</div>
  </div>

  <div id="terminal" style="opacity: 0; pointer-events: none; transition: opacity 0.5s ease;">
    <div id="terminal-header">
      <div id="terminal-buttons">
        <div class="terminal-button" id="close-button"></div>
        <div class="terminal-button" id="minimize-button"></div>
        <div class="terminal-button" id="maximize-button"></div>
      </div>
    </div>
    <div id="terminal-content">
      <p id="terminal-text"></p>
    </div>
  </div>

  <div id="video-background">
    <video autoplay muted loop playsinline id="myVideo">
      <source src="./assets/back/default.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
    <div id="audio-background">
      <audio autoplay loop id="myAudio">
        <source src="./assets/music/song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>
    <div id="video-overlay"></div>
  </div>

  <div id="scroll-wrapper">
    <!-- Volume controls visible after terminal -->
    <div class="top-left-controls" id="top-left-controls">
      <button id="muteBtn" class="glass-btn"><i class="fas fa-volume-up" id="muteIcon"></i></button>
      <div class="volume-slider-wrapper">
        <input type="range" id="volumeSlider" class="volume-slider-input" min="0" max="100" value="20">
      </div>
    </div>

    <div id="blurred-box" class="tilt-element">

      <div class="card-banner">
        <!-- Chèn link ảnh/gif banner của bạn vào src="" bên dưới -->
        <img id="profile-banner-img" src="./assets/back/banner.gif" alt="Banner"
          style="width: 100%; height: 100%; object-fit: cover;">
      </div>

      <div class="profile-header">
        <div class="profile-picture-container">
          <img id="profile-picture" src="./assets/pfp/default.jpg" alt="Profile Picture">
          <div id="discord-sync-indicator" class="sync-indicator">
            <i class="fab fa-discord"></i>
          </div>
          <img id="avatar-frame" src="" alt="Avatar Frame">
          <div class="custom-status-icon">
            <i class="fa-solid fa-heart" style="color: #ff4b4b;"></i>
          </div>
        </div>

        <div class="profile-info">
          <div class="username-row">
            <span id="username">huyizme</span>
            <span id="typing-cursor">|</span>
            <div class="badges-container">
              <img src="./assets/badge/nitro.png" alt="nitro badge">
              <img src="./assets/badge/1837-evolving-badge-nitro-24-months.png" alt="24month boost">
            </div>
          </div>
          <div class="profile-subtext">
            <span class="subtext-line secondary-sub">Joined since 2004</span>
          </div>
        </div>
      </div>

      <div class="widgets-container">
        <div class="discord-widget">
          <div class="discord-content">
            <div class="discord-icon">
              <img id="discord-avatar" src="" alt="Discord Avatar" draggable="false" loading="lazy">
              <div class="status-indicator"></div>
            </div>
            <div class="discord-meta">
              <b id="discord-username">huyizme</b>
              <div>
                <span id="discord-status-dot" style="display: none;"></span>
                <span id="discord-status-text">currently doing nothing</span>
              </div>
            </div>
          </div>
          <div class="discord-activity" style="display: none;">
            <div id="discord-activity-info">
              <div id="discord-album-art"></div>
              <div class="discord-activity-content">
                <div id="discord-activity-name"></div>
                <div id="discord-activity-details"></div>
                <div id="discord-activity-state"></div>
              </div>
            </div>
            <div id="discord-no-activity">I'm not currently doing anything!</div>
          </div>
        </div>

        <div class="spotify-widget">

          </div>
          <div class="spotify-info">

            <div class="spotify-timeline" id="spotify-progress-container" style="cursor: pointer;">

            <div class="spotify-controls">

              <div class="spotify-buttons">

      </div>

      <div class="gear-lab-container">
        <div class="gear-title"><i class="fa-solid fa-id-card"></i> About Me</div>
        <div class="gear-list">
          <div class="gear-item anime">
            <i class="fa-solid fa-heart"></i>
            <span>Anime Lover</span>
          </div>
          <div class="gear-item coder">

            <span>Coder</span>
          </div>
          <div class="gear-item gamer">
            <i class="fa-solid fa-gamepad"></i>

        <div class="links">
          <a href="https://discord.com/users/854959889322213406" target="_blank" title="Discord"><i

          <a href="https://www.youtube.com/@huypham6031" target="_blank" title="YouTube"><i
              class="fa-brands fa-youtube"></i></a>
          <a href="https://open.spotify.com/user/31pwrvxcti7gmzhp3s74z7l6hlbi" target="_blank" title="Spotify"><i

              class="fa-brands fa-tiktok"></i></a>

      <div class="card-footer" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; padding: 15px 24px;">
        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px;">
          <span class="footer-stat"><i class="fa-solid fa-eye"></i> <span id="view-count">--</span></span>
          <span class="footer-divider">|</span>
          <span class="footer-stat" id="dual-clock">
            <span class="clock-item">VN <span id="vn-time">--:--</span></span>
            <span class="clock-divider">|</span>
            <span class="clock-item">US <span id="us-time">--:--</span></span>
          </span>
        </div>
        <div class="footer-buttons" style="display: flex; flex-wrap: wrap; gap: 10px;">
          <a href="anime/" class="footer-gear-btn">
            <i class="fa-solid fa-film"></i>
            <span>Anime Showcase</span>
          </a>
          <a href="mygear/" class="footer-gear-btn">
            <i class="fa-solid fa-desktop"></i>
            <span>My Gear &amp; Setup</span>
          </a>
        </div>
      </div>

      <div style="display: none;">
        <button id="randomBtn" class="music-btn"><i class="fas fa-random"></i></button>
      </div>
    </div>

    <!-- My Setup Section moved to /mygear -->


    <div class="bottom-player-widget tilt-element" id="bottom-player-widget" style="position: relative; bottom: auto; margin: 20px auto 40px; transform: none; left: auto;">
      <div class="player-album-art">
        <div class="art-placeholder" style="background-color: #2b0e35; overflow: hidden; position: relative;">
          <img id="bottom-art" src="./assets/pfp/default.jpg"
            style="width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; top: 0; left: 0;">
          <i class="fa-solid fa-music" id="bottom-art-icon"></i>
        </div>
      </div>
      <div class="player-center">
        <div class="player-title" id="bottom-title">{+_+}</div>
        <div class="player-timeline-container">
          <span class="time" id="bottom-current-time">0:00</span>
          <div class="player-progress-bar" id="bottom-progress-container" style="cursor: pointer;">
            <div class="player-progress" id="bottom-progress" style="width: 0%;"></div>
          </div>
          <span class="time" id="bottom-total-time">0:00</span>
        </div>
      </div>
      <div class="player-controls">
        <i class="fa-solid fa-backward-step" id="prev-btn" style="cursor: pointer;"></i>
        <i class="fa-solid fa-play" id="bottom-play-btn" style="cursor: pointer; font-size: 20px; margin: 0 5px;"></i>
        <i class="fa-solid fa-forward-step" id="next-btn" style="cursor: pointer;"></i>
      </div>
    </div>
  </div>

  <script src="./assets/js/error-handler.js"></script>
  <script src="./assets/js/console.js"></script>
  <script src="./assets/js/lanyard.js"></script>
  <script src="./assets/js/discord.js"></script>
  <script src="./assets/js/clock.js"></script>
  <script src="./assets/js/script.js"></script>
  <script src="./assets/js/title.js"></script>
  <script src="./assets/js/username-animation.js"></script>
  <script src="./assets/js/tilt-effect.js"></script>
  <script src="./assets/js/music-control.js"></script>
  <script src="./assets/js/view-counter.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const preloader = document.getElementById('global-preloader');
        const barFill = document.getElementById('loader-bar-fill');
        const textStatus = document.getElementById('loader-text-status');
        
        let startTimestamp = null;
        const duration = 2000; // 2 seconds strict loading time

        function step(timestamp) {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = timestamp - startTimestamp;
            const percentage = Math.min((progress / duration) * 100, 100);
            
            if(barFill) {
                barFill.style.width = percentage + '%';
            }
            
            if (percentage > 80 && textStatus) {
                textStatus.innerText = "Ready...";
            }

            if (progress < duration) {
                window.requestAnimationFrame(step);
            } else {
                // Done loading
                const terminalNode = document.getElementById('terminal');
                if (terminalNode) {
                    terminalNode.style.pointerEvents = 'auto';
                    window.requestAnimationFrame(() => {
                        terminalNode.style.opacity = '1';
                    });
                }
                
                setTimeout(() => {
                    if (preloader) {
                        preloader.style.opacity = '0';
                        setTimeout(() => {
                            preloader.style.display = 'none';
                        }, 400); // Wait for CSS transition
                    }
                }, 200);
            }
        }

        window.requestAnimationFrame(step);
    });
  </script>
</body>

</html>
